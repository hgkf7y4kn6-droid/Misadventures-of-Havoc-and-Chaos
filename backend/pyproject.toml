[project]
name = "havoc-and-chaos"
version = "1.0.0"
description = "The Misadventures of Havoc and Chaos — a real-time multiplayer AI-narrated cooperative misadventure (game server)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
polly = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
